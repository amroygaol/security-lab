global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Future security exporters
  - job_name: "security-tools-exporters"
    static_configs:
      - targets:
          - "security-tools-exporter:9105"